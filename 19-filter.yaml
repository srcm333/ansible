- name: demo on filters
  hosts: local
  connection: local
  vars:
    topics: Linux, Shell, Ansible, Terraform
    tagMap:
      name: Ansible
      project: roboshop
      environment: Dev
    full_name: SriRamchandra Murthy
    tagsList: [
        {
            "key": "name",
            "value": "Ansible"
        },
        {
            "key": "project",
            "value": "roboshop"
        },
        {
            "key": "environment",
            "value": "Dev"
        }
    ]

  tasks:
    - name: convert string to list
      debug:
        msg: "Topics are {{ topics | split(',') }}"

    - name: set default common_value
      debug:
        msg: "Hi, {{ GREETING | default('Good Morning') }}"

    - name: convert map to list
      debug:
        msg: "{{ tagMap | dict2items }}"

    - name: convert list to map
      debug:
        msg: "{{ tagsList | items2dict }}"

    - name: convert to uppercase
      debug:
        msg: "{{ full_name | upper }}"

    - name: convert to lowercase
      debug:
        msg: "{{ full_name | lower }}"  