- name: conditions using ansible_facts
  hosts: frontend
  tasks:
    - name: print if ReadHat
      debug:
        msg: "OS Family is ReadHat, package manager is dnf"
      when: ansible_facts.os_family == "RedHat"
  
    - name: print if Debian
      debug:
        msg: "OS Family is Debian, package manager is apt-get"
      when: ansible_facts.os_family == "Debian"